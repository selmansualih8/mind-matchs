<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a quiz to see how well people know you." />
    <title>MindMatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header"><a class="brand" href="/">Mind<span>Match</span></a><button class="plain-button" id="home-create">Make a quiz</button></header>
    <main id="app"></main>
    <template id="home-template">
      <section class="hero">
        <div><p class="eyebrow">MAKE A QUIZ · SEND A LINK · COMPARE ANSWERS</p><h1>How well do they <em>really</em> know you?</h1><p class="lead">Answer questions about yourself, then send your quiz to a friend, crush, or group chat.</p><button class="primary" data-action="create">Make my MindMatch <span>→</span></button><p class="quiet">No account needed.</p></div>
        <aside class="preview"><div class="preview-top"><b>MindMatch</b><span>3 / 10</span></div><div class="bar"><i style="width:30%"></i></div><p>What do you think they chose?</p><h2>My ideal Sunday looks like…</h2><div class="preview-options"><span>Going out</span><strong>Staying in ✓</strong><span>Somewhere quiet</span><span>Brunch, always</span></div></aside>
      </section>
      <section class="how"><p class="eyebrow">HOW IT WORKS</p><div><article><b>01</b><h2>Make it yours</h2><p>Answer the questions first.</p></article><article><b>02</b><h2>Send your link</h2><p>Share it with whoever you choose.</p></article><article><b>03</b><h2>See the result</h2><p>Find out who got the most right.</p></article></div></section>
    </template>
    <script src="app.js"></script>
  </body>
</html>
